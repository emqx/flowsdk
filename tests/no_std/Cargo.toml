[package]
name = "flowsdk-no-std-tests"
version = "0.0.0"
edition = "2021"
publish = false

# Keep host workspace members and their default features out of this graph.
[workspace]
resolver = "2"

[dependencies]
flowsdk = { path = "../..", default-features = false, features = ["alloc"] }
bytes = { version = "1.12.1", default-features = false }
portable-atomic = { version = "1", optional = true, default-features = false, features = ["critical-section"] }

[features]
default = []
durable-session = ["flowsdk/durable-session"]
strict-protocol-compliance = ["flowsdk/strict-protocol-compliance"]
std = ["flowsdk/std"]
portable-atomics = ["flowsdk/portable-atomics", "dep:portable-atomic"]

[[test]]
name = "parser"
path = "../parser_tests.rs"

[[test]]
name = "session"
path = "../session_reliability.rs"

[[test]]
name = "subscriptions"
path = "../server_subscription_identifiers.rs"
