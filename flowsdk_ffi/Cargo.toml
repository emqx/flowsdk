[package]
name = "flowsdk_ffi"
version = "0.8.2"
edition = "2021"
description = "FFI bindings for FlowSDK, allowing multi-language integration."
license = "Apache-2.0"
repository = "https://github.com/emqx/flowsdk"
documentation = "https://docs.rs/flowsdk_ffi"
keywords = ["ffi", "mqtt", "bindings"]
categories = ["api-bindings"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flowsdk = { path = "..", version = "0.8.2", default-features = false, features = ["std", "strict-protocol-compliance"] }
libc = "0.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }
# Keep the runtime version aligned with tools/uniffi-bindgen/Cargo.toml.
uniffi = { version = "=0.29.5", default-features = false, optional = true }
serde_json = { version = "1.0", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring"] }
rustls-openssl = { version = "0.3", optional = true }
openssl = { version = "0.10", optional = true }
rustls-native-certs = { version = "0.8.5", optional = true }
# Mainstream quinn-proto (ring crypto, crates.io)
quinn-proto = { version = "0.11", optional = true, default-features = false, features = ["rustls", "ring"] }
# Fork quinn-proto (OpenSSL crypto, for release-small builds)
quinn-proto-openssl = { package = "quinn-proto", git = "https://github.com/qzhuyan/quinn.git", branch = "dev/william/ring-no-deps", optional = true, default-features = false, features = ["rustls-openssl"] }
rustls-pki-types = { version = "1.10", optional = true, features = ["std"] }

[features]
default = ["tls", "quic", "uniffi-bindings"]
# JSON C commands/events and serialization of FFI records (opt-in).
json = ["dep:serde", "dep:serde_json"]
# Checkpoint/restore APIs use JSON for opaque checkpoint bytes (opt-in).
durable-session = ["flowsdk/durable-session", "json"]
quic = [
	"flowsdk/quic-proto",
	"flowsdk/async-client",
	"flowsdk/strict-protocol-compliance",
	"dep:quinn-proto",
	"dep:rustls",
	"dep:rustls-native-certs",
	"dep:rustls-pki-types",
]
quic-openssl = [
	"flowsdk/quic-proto-openssl",
	"flowsdk/async-client",
	"flowsdk/strict-protocol-compliance",
	"quic",
	"dep:quinn-proto-openssl",
	"dep:rustls-openssl",
	"dep:openssl",
]
tls = ["flowsdk/rustls-tls", "flowsdk/strict-protocol-compliance", "dep:rustls", "dep:rustls-native-certs", "dep:rustls-pki-types"]
# UniFFI bindings for Kotlin/Python/Swift language bindings
uniffi-bindings = ["dep:uniffi"]

[dev-dependencies]
openssl = "0.10"
tempfile = "3"
